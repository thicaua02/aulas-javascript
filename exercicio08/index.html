<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria com SimpleLightbox</title>
<link href="https://cdn.jsdelivr.net/npm/simplelightbox@2.14.3/dist/simple-lightbox.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Exercício 08: Galeria de Fotos usando a lib SimpleLightbox</h1>
    <p>Site oficial: <a href="https://simplelightbox.js.org/" target="_blank">SimpleLightbox</a></p>

    <p><i>Veja a documentação no site oficial e, seguindo as instruções, monte a estrutura necessária para implementar uma galeria de imagens.</i></p>

    <hr>

    <div class="galeria">
         <!-- Coloque aqui cada foto pequena (thumb) dentro de um link <a>.
        E cada link, deve apontar para a versão grande da foto. -->
        <a href="imagens/grande1.jpg"><img src="imagens/thumb1.jpg" alt="" title="A serenidade dos campos verdes."></a>
        <a href="imagens/grande2.jpg"><img src="imagens/thumb2.jpg" alt="" title="As estrelas voltaram a brilhar."></a>
        <a href="imagens/grande3.jpg"><img src="imagens/thumb3.jpg" alt="" title="Ilha mais bonita que já vi."></a>
    </div>

    <div class="galeria">
         <!-- Coloque aqui cada foto pequena (thumb) dentro de um link <a>.
        E cada link, deve apontar para a versão grande da foto. -->
        <a href="imagens/grande4.jpg"><img src="imagens/thumb4.jpg" alt="" title="Bora viajar de trêm!"></a>
        <a href="imagens/grande5.jpg"><img src="imagens/thumb5.jpg" alt="" title="Uma experiência única!"></a>
        <a href="imagens/grande6.jpg"><img src="imagens/thumb6.jpg" alt="" title="Uma montanha qualquer"></a>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/simplelightbox@2.14.3/dist/simple-lightbox.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
