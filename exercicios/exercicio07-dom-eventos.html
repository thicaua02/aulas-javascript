<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício DOM + Eventos</title>
    <style>
        *,*::before,*::after { box-sizing: border-box; }

        body {
            font-family: system-ui, sans-serif;
            background: #f4f4f4;
        }

        .container {
            width: 80%;
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
        }

       
    </style>
</head>

<body>
    <div class="container">
        <h1>Exercício DOM + Eventos</h1>
        <section>
            <h2>Calculadora de Média</h2>
            <form id="formulario" action="" method="post">
                <p>
                    <label for="nota1">Nota 1:</label>
                    <input type="number" id="nota1" required min="0" max="10" step="0.01">

                    <label for="nota2">Nota 2:</label>
                    <input type="number" id="nota2" required min="0" max="10" step="0.01">
                </p>
                <button>Calcular Média</button>
            </form>
        </section>

        <section>
            <h2>Resultados</h2>
            <div>
                <p id="media"></p>
                <p id="status"></p>
            </div>
        </section>

    </div>


    <script src="exercicio07.js"></script>   

</body>

</html>
